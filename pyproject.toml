[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "antigravitystreaming"
version = "0.1.0"
description = "Stream text from the signed-in Google Antigravity CLI"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Eliran Wong" }]

[tool.setuptools]
packages = ["antigravitystreaming"]

[tool.setuptools.package-dir]
antigravitystreaming = "."
